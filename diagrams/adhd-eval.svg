<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" class="diagram" role="img" aria-labelledby="adhd-t">
  <title id="adhd-t">Accuracy of the original study's best model (Random Forest) under three evaluations: 93.1% when leaving one drawing out, as published; 77.0% when leaving one child out; 78.2% when feature selection and tuning are also kept inside each fold; the majority class alone gives 51.7%</title>
  <text class="d-label" x="20" y="24">Original study's best model (Random Forest), 29 children · 87 drawings</text>
  <!-- scale: 0% → x=250, 100% → x=610 (3.6 px per point) -->
  <g class="d-grid">
    <line x1="250" y1="40" x2="250" y2="214"/><line x1="340" y1="40" x2="340" y2="214"/>
    <line x1="430" y1="40" x2="430" y2="214"/><line x1="520" y1="40" x2="520" y2="214"/>
    <line x1="610" y1="40" x2="610" y2="214"/>
  </g>
  <g class="d-small d-muted">
    <text x="250" y="232" text-anchor="middle">0%</text><text x="340" y="232" text-anchor="middle">25%</text>
    <text x="430" y="232" text-anchor="middle">50%</text><text x="520" y="232" text-anchor="middle">75%</text>
    <text x="610" y="232" text-anchor="middle">100%</text>
  </g>
  <text class="d-label" x="238" y="62" text-anchor="end">Leave one drawing out</text>
  <text class="d-small d-muted" x="238" y="78" text-anchor="end">as published</text>
  <rect class="d-bar d-bar-soft" x="250" y="50" width="335" height="30" rx="3"/>
  <text class="d-small d-onbar" x="577" y="70" text-anchor="end">93.1%</text>

  <text class="d-label" x="238" y="117" text-anchor="end">Leave one child out</text>
  <text class="d-small d-muted" x="238" y="133" text-anchor="end">features still chosen on all data</text>
  <rect class="d-bar d-bar-soft" x="250" y="105" width="277" height="30" rx="3"/>
  <text class="d-small d-onbar" x="519" y="125" text-anchor="end">77.0%</text>

  <text class="d-label" x="238" y="172" text-anchor="end">Child out + nested selection</text>
  <text class="d-small d-muted" x="238" y="188" text-anchor="end">honest estimate</text>
  <rect class="d-bar" x="250" y="160" width="282" height="30" rx="3"/>
  <text class="d-small d-onbar" x="524" y="180" text-anchor="end">78.2%</text>

  <line class="d-wire d-dash d-accent-line" x1="436" y1="40" x2="436" y2="214"/>
  <text class="d-small d-accent-text" x="440" y="210">majority class 51.7%</text>
</svg>
