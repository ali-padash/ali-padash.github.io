<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" class="diagram" role="img" aria-labelledby="gbn-t">
  <title id="gbn-t">Go-Back-N sender window: 3-bit sequence numbers, a window of four frames, and resending the whole window on timeout</title>
  <text class="d-label" x="20" y="28">Sender: 3-bit sequence numbers, window size 4</text>
  <g>
    <rect class="d-box d-done" x="20"  y="48" width="44" height="40" rx="5"/><text class="d-label" x="42"  y="73" text-anchor="middle">5</text>
    <rect class="d-box d-done" x="70"  y="48" width="44" height="40" rx="5"/><text class="d-label" x="92"  y="73" text-anchor="middle">6</text>
    <rect class="d-box d-accent" x="120" y="48" width="44" height="40" rx="5"/><text class="d-label" x="142" y="73" text-anchor="middle">7</text>
    <rect class="d-box d-accent" x="170" y="48" width="44" height="40" rx="5"/><text class="d-label" x="192" y="73" text-anchor="middle">0</text>
    <rect class="d-box" x="220" y="48" width="44" height="40" rx="5"/><text class="d-label" x="242" y="73" text-anchor="middle">1</text>
    <rect class="d-box" x="270" y="48" width="44" height="40" rx="5"/><text class="d-label" x="292" y="73" text-anchor="middle">2</text>
    <rect class="d-box d-faint" x="320" y="48" width="44" height="40" rx="5"/><text class="d-label d-muted" x="342" y="73" text-anchor="middle">3</text>
    <rect class="d-box d-faint" x="370" y="48" width="44" height="40" rx="5"/><text class="d-label d-muted" x="392" y="73" text-anchor="middle">4</text>
  </g>
  <rect class="d-window" x="114" y="40" width="206" height="56" rx="8"/>
  <text class="d-small" x="217" y="112" text-anchor="middle">window (base = 7)</text>
  <g class="d-legend">
    <rect class="d-box d-done" x="440" y="44" width="14" height="14" rx="3"/><text class="d-small" x="462" y="56">acknowledged</text>
    <rect class="d-box d-accent" x="440" y="64" width="14" height="14" rx="3"/><text class="d-small" x="462" y="76">sent, awaiting ACK</text>
    <rect class="d-box" x="440" y="84" width="14" height="14" rx="3"/><text class="d-small" x="462" y="96">may be sent</text>
    <rect class="d-box d-faint" x="440" y="104" width="14" height="14" rx="3"/><text class="d-small" x="462" y="116">outside window</text>
  </g>
  <!-- channel -->
  <rect class="d-chip" x="20" y="140" width="600" height="40" rx="6"/>
  <text class="d-small" x="320" y="157" text-anchor="middle">simulated channel (UDP): 20% packet loss · 20% ACK loss · 1% bit errors</text>
  <text class="d-small" x="320" y="172" text-anchor="middle">CRC (generator 10011) detects corrupted frames · Hamming code corrects single-bit errors</text>
  <text class="d-label" x="20" y="212">Receiver accepts frames in order and sends cumulative ACKs.</text>
  <text class="d-label d-accent-text" x="20" y="236">Timeout on frame 7 → resend 7, 0, 1, 2 (“go back N”).</text>
</svg>
